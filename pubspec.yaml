name: reer_sh_yoonis
description: CILMI FOUNDATION — Family Lineage & Mutual-Aid Platform
publish_to: 'none'
version: 1.0.2+4

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.9.1
  flutter_riverpod: ^2.6.1
  intl: ^0.20.2
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  permission_handler: ^11.4.0
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/brand/app-icon-1024.png
  adaptive_icon_background: "#0F3D3E"
  adaptive_icon_foreground: assets/brand/app-icon-adaptive-foreground.png
  adaptive_icon_foreground_inset: 0
  web:
    generate: true
    image_path: assets/brand/app-icon-1024.png
    background_color: "#0F3D3E"
    theme_color: "#0F3D3E"
  windows:
    generate: true
    image_path: assets/brand/app-icon-1024.png
  macos:
    generate: true
    image_path: assets/brand/app-icon-1024.png

flutter:
  uses-material-design: true
  assets:
    - env.json
    - assets/l10n/en.json
    - assets/l10n/so.json
    - assets/logo.png
    - assets/brand/
    - assets/icons/whatsapp.svg
    - assets/icons/call.svg
